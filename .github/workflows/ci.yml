name: CI

on:
  pull_request:
    branches:
      - master
    # Changes to the documentation alone neither build nor test anything.
    paths-ignore:
      - "**/*.md"
      - "documentation/**"
  push:
    branches:
      - master
    paths-ignore:
      - "**/*.md"
      - "documentation/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      # Some generated files exceed the 260 character path limit of Windows under the runner's work directory.
      - name: Allow Long Paths
        run: git config --system core.longpaths true

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nerdbank.GitVersioning computes the version from the history.
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      # Packages go to the work drive; the system drive of the runner is slow.
      - name: Use The Work Drive For Packages
        run: echo "NUGET_PACKAGES=$env:RUNNER_TEMP\nuget-packages" >> $env:GITHUB_ENV

      # This job restores the whole solution, so it saves the package cache; the test jobs only read it.
      - name: Package Cache
        id: packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/nuget-packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/*.props', '**/*.targets', 'global.json') }}

      # Warnings are errors, so a successful build means there are none.
      - name: Build
        run: dotnet build StyleCopAnalyzers.sln --configuration Release

      # The default build of the code fixes also builds the Roslyn 5.0 flavor for the package. Build it on its own as
      # well so that a problem in that flavor is reported against this step.
      - name: Build Roslyn 5.0 flavor
        run: dotnet build StyleCop.Analyzers/StyleCop.Analyzers.CodeFixes/StyleCop.Analyzers.CodeFixes.csproj --configuration Release -p:RoslynVersion=5.0

  test:
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      # Let every project finish so one failure does not hide the others.
      fail-fast: false
      matrix:
        project:
          - StyleCop.Analyzers.Test
          - StyleCop.Analyzers.Test.CSharp7
          - StyleCop.Analyzers.Test.CSharp8
          - StyleCop.Analyzers.Test.CSharp9
          - StyleCop.Analyzers.Test.CSharp10
          - StyleCop.Analyzers.Test.CSharp11
          - StyleCop.Analyzers.Test.CSharp12
          - StyleCop.Analyzers.Test.CSharp13
        framework:
          - net10.0
        # Roslyn flavor of the analyzers under test. It is an axis only so that the include entry below, which repeats the
        # project and framework of an existing combination, adds a job instead of modifying that combination.
        roslyn:
          - '4.8'
        # Visual Studio and MSBuild run the analyzers on .NET Framework. The rule code is the same on both runtimes, so one
        # project covers .NET Framework, in a job of its own: CSharp13, which inherits the tests of every other project.
        include:
          - project: StyleCop.Analyzers.Test.CSharp13
            framework: net472
          # The same tests against the Roslyn 5.0 build of the analyzers, the compiler of the .NET 10 SDK.
          - project: StyleCop.Analyzers.Test.CSharp13
            framework: net10.0
            roslyn: '5.0'
    steps:
      - name: Allow Long Paths
        run: git config --system core.longpaths true

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      # Packages go to the work drive; the system drive of the runner is slow.
      - name: Use The Work Drive For Packages
        run: echo "NUGET_PACKAGES=$env:RUNNER_TEMP\nuget-packages" >> $env:GITHUB_ENV

      # Only the job that restores the whole solution saves the cache, so it holds every package the test projects use.
      - name: Restore Package Cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/nuget-packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/*.props', '**/*.targets', 'global.json') }}

      - name: Test
        run: dotnet test StyleCop.Analyzers/${{ matrix.project }}/${{ matrix.project }}.csproj --configuration Release --framework ${{ matrix.framework }} --logger trx --results-directory TestResults -p:RoslynVersion=${{ matrix.roslyn || '4.8' }}

      - name: Upload Test Results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results-${{ matrix.project }}-${{ matrix.framework }}-roslyn${{ matrix.roslyn || '4.8' }}
          path: TestResults/*.trx
          if-no-files-found: warn
