name: CI

# The 1.x line: the analyzers build against Roslyn 1.2.1 for netstandard1.1 and the tests run on net10.0 and .NET Framework.
on:
  pull_request:
    branches:
      - release/1.x
    # Changes to the documentation alone neither build nor test anything.
    paths-ignore:
      - "**/*.md"
      - "documentation/**"
  push:
    branches:
      - release/1.x
    paths-ignore:
      - "**/*.md"
      - "documentation/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # No project here uses a workload. Without this, every MSBuild start reads the workload manifests of the runner image,
  # which takes several seconds on Windows.
  MSBuildEnableWorkloadResolver: false
  # The parts of a split test job take about the same time. The last filter of a split is the negation of the others,
  # so every test runs in exactly one part, including the tests of a namespace added later.
  TEST_PART_1_OF_2: 'FullyQualifiedName~.DocumentationRules.|FullyQualifiedName~.ReadabilityRules.'
  TEST_PART_2_OF_2: 'FullyQualifiedName!~.DocumentationRules.&FullyQualifiedName!~.ReadabilityRules.'
  TEST_PART_1_OF_3: 'FullyQualifiedName~.DocumentationRules.|FullyQualifiedName~.LayoutRules.'
  TEST_PART_2_OF_3: 'FullyQualifiedName~.ReadabilityRules.|FullyQualifiedName~.SpacingRules.'
  TEST_PART_3_OF_3: 'FullyQualifiedName!~.DocumentationRules.&FullyQualifiedName!~.LayoutRules.&FullyQualifiedName!~.ReadabilityRules.&FullyQualifiedName!~.SpacingRules.'

jobs:
  # Builds every project with the analyzers on: CSharp13 references all the others. The test jobs build without the
  # analyzers, which halves their build; source generators run either way.
  build:
    name: Build
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      # Fetches only the commit under test, the same way as the test jobs.
      - name: Checkout
        run: |
          git init -q
          git config core.longpaths true
          git remote add origin ${{ github.server_url }}/${{ github.repository }}
          git fetch -q --depth=1 --no-tags origin ${{ github.sha }}
          git checkout -q FETCH_HEAD

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      # Warnings are errors, so a successful build means there are none.
      - name: Build
        env:
          NUGET_PACKAGES: ${{ runner.temp }}/nuget-packages
        run: dotnet build StyleCop.Analyzers/StyleCop.Analyzers.Test.CSharp13/StyleCop.Analyzers.Test.CSharp13.csproj --configuration Release --framework net10.0

  test:
    name: Test (${{ matrix.project }}, ${{ matrix.framework }}${{ matrix.part && format(', part {0} of {1}', matrix.part, matrix.parts) || '' }})
    # .NET Framework needs Windows; the net10.0 runs go to Linux on Arm, which starts and builds faster.
    runs-on: ${{ matrix.framework == 'net472' && 'windows-latest' || 'ubuntu-24.04-arm' }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # The tests need all four cores of a runner for one to two minutes, so the slowest projects run in parts on
        # several runners. The .NET Framework run is the slowest and has the longest setup, so it gets three.
        include:
          - { project: StyleCop.Analyzers.Test, framework: net10.0 }
          - { project: StyleCop.Analyzers.Test.CSharp7, framework: net10.0 }
          - { project: StyleCop.Analyzers.Test.CSharp8, framework: net10.0 }
          - { project: StyleCop.Analyzers.Test.CSharp9, framework: net10.0, part: 1, parts: 2 }
          - { project: StyleCop.Analyzers.Test.CSharp9, framework: net10.0, part: 2, parts: 2 }
          - { project: StyleCop.Analyzers.Test.CSharp10, framework: net10.0, part: 1, parts: 2 }
          - { project: StyleCop.Analyzers.Test.CSharp10, framework: net10.0, part: 2, parts: 2 }
          - { project: StyleCop.Analyzers.Test.CSharp11, framework: net10.0, part: 1, parts: 2 }
          - { project: StyleCop.Analyzers.Test.CSharp11, framework: net10.0, part: 2, parts: 2 }
          - { project: StyleCop.Analyzers.Test.CSharp12, framework: net10.0 }
          - { project: StyleCop.Analyzers.Test.CSharp13, framework: net10.0 }
          # Older Visual Studio and MSBuild run the analyzers on .NET Framework. The rule code is the same on both runtimes,
          # so one project covers .NET Framework: CSharp13, which inherits the tests of every other project.
          - { project: StyleCop.Analyzers.Test.CSharp13, framework: net472, part: 1, parts: 3 }
          - { project: StyleCop.Analyzers.Test.CSharp13, framework: net472, part: 2, parts: 3 }
          - { project: StyleCop.Analyzers.Test.CSharp13, framework: net472, part: 3, parts: 3 }
    steps:
      # Fetches only the commit under test. actions/checkout spends seconds on Windows removing credentials from submodules,
      # which this repository does not have; the repository is public, so plain git needs no token. Some generated files
      # exceed the 260 character path limit of Windows under the runner's work directory.
      - name: Checkout
        run: |
          git init -q
          git config core.longpaths true
          git remote add origin ${{ github.server_url }}/${{ github.repository }}
          git fetch -q --depth=1 --no-tags origin ${{ github.sha }}
          git checkout -q FETCH_HEAD

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      # Packages go to the work drive; the system drive of the runner is slow. They are not cached: downloading them
      # takes 7-11 s on Linux and 17 s on Windows, restoring a cache entry of 540-620 MB as long.
      - name: Test
        env:
          NUGET_PACKAGES: ${{ runner.temp }}/nuget-packages
          RunAnalyzers: false
        run: dotnet test StyleCop.Analyzers/${{ matrix.project }}/${{ matrix.project }}.csproj --configuration Release --framework ${{ matrix.framework }} --logger trx --results-directory TestResults ${{ matrix.part && format('--filter "{0}"', env[format('TEST_PART_{0}_OF_{1}', matrix.part, matrix.parts)]) || '' }}

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results-${{ matrix.project }}-${{ matrix.framework }}${{ matrix.part && format('-part{0}of{1}', matrix.part, matrix.parts) || '' }}
          path: TestResults/*.trx
          if-no-files-found: ignore
