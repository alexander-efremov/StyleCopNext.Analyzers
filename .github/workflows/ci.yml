name: CI

# The 1.x line: the analyzers build against Roslyn 1.2.1 for netstandard1.1 and the tests run on net6.0 and .NET Framework.
on:
  pull_request:
    branches:
      - release/1.x
    # Changes to the documentation alone neither build nor test anything.
    paths-ignore:
      - "**/*.md"
      - "documentation/**"
  push:
    branches:
      - release/1.x
    paths-ignore:
      - "**/*.md"
      - "documentation/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Restores the whole solution into the package cache when the cache misses; on a hit it only looks the cache up.
  packages:
    name: Package Cache
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Allow Long Paths
        run: git config --system core.longpaths true

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Use The Work Drive For Packages
        run: echo "NUGET_PACKAGES=$env:RUNNER_TEMP\nuget-packages" >> $env:GITHUB_ENV

      - name: Package Cache
        id: packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/nuget-packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/*.props', '**/*.targets', 'global.json') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore
        if: steps.packages.outputs.cache-hit != 'true'
        run: dotnet restore StyleCopAnalyzers.sln


  test:
    name: Test (${{ matrix.project }})
    # .NET Framework needs Windows; the net6.0 runs go to Linux on Arm, which starts and builds faster.
    runs-on: ${{ matrix.framework == 'net472' && 'windows-latest' || 'ubuntu-24.04-arm' }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        project:
          - StyleCop.Analyzers.Test
          - StyleCop.Analyzers.Test.CSharp7
          - StyleCop.Analyzers.Test.CSharp8
          - StyleCop.Analyzers.Test.CSharp9
          - StyleCop.Analyzers.Test.CSharp10
          - StyleCop.Analyzers.Test.CSharp11
          - StyleCop.Analyzers.Test.CSharp12
          - StyleCop.Analyzers.Test.CSharp13
        framework:
          - net6.0
        # Older Visual Studio and MSBuild run the analyzers on .NET Framework. The rule code is the same on both runtimes, so
        # one project covers .NET Framework, in a job of its own: CSharp13, which inherits the tests of every other project.
        include:
          - project: StyleCop.Analyzers.Test.CSharp13
            framework: net472
    steps:
      # Some generated files exceed the 260 character path limit of Windows under the runner's work directory.
      - name: Allow Long Paths
        if: runner.os == 'Windows'
        run: git config --system core.longpaths true

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nerdbank.GitVersioning computes the version from the history.
          fetch-depth: 0

      # The SDK builds; the .NET 6 runtime runs the net6.0 test assemblies.
      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            6.0.x
            10.0.x

      # Packages go to the work drive; the system drive of the runner is slow.
      - name: Use The Work Drive For Packages
        shell: pwsh
        run: echo "NUGET_PACKAGES=$(Join-Path $env:RUNNER_TEMP nuget-packages)" >> $env:GITHUB_ENV

      # The Linux jobs save their own cache entry on a miss. The bare "nuget-" fallback lets the first Linux
      # run reuse the Windows entry, since the global packages folder is portable across operating systems.
      - name: Package Cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/nuget-packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/*.props', '**/*.targets', 'global.json') }}
          restore-keys: |
            nuget-${{ runner.os }}-
            nuget-

      # Analyzers take half of the build. The net6.0 CSharp13 job builds every project, so it alone runs them; source
      # generators run either way.
      - name: Test
        env:
          RunAnalyzers: ${{ matrix.project == 'StyleCop.Analyzers.Test.CSharp13' && matrix.framework == 'net6.0' }}
        run: dotnet test StyleCop.Analyzers/${{ matrix.project }}/${{ matrix.project }}.csproj --configuration Release --framework ${{ matrix.framework }} --logger trx --results-directory TestResults

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results-${{ matrix.project }}-${{ matrix.framework }}
          path: TestResults/*.trx
          if-no-files-found: ignore
