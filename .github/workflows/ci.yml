name: CI

# The 1.x line: the analyzers build against Roslyn 1.2.1 for netstandard1.1 and the tests run on net6.0 and .NET Framework.
on:
  pull_request:
    branches:
      - release/1.x
  push:
    branches:
      - release/1.x
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Test (${{ matrix.project }})
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        project:
          - StyleCop.Analyzers.Test
          - StyleCop.Analyzers.Test.CSharp7
          - StyleCop.Analyzers.Test.CSharp8
          - StyleCop.Analyzers.Test.CSharp9
          - StyleCop.Analyzers.Test.CSharp10
          - StyleCop.Analyzers.Test.CSharp11
          - StyleCop.Analyzers.Test.CSharp12
          - StyleCop.Analyzers.Test.CSharp13
        # Older Visual Studio and MSBuild run the analyzers on .NET Framework. The rule code is the same on both runtimes, so
        # one project covers .NET Framework: CSharp13, which inherits the tests of every other project.
        include:
          - project: StyleCop.Analyzers.Test.CSharp13
            netfx: true
    steps:
      # Some generated files exceed the 260 character path limit of Windows under the runner's work directory.
      - name: Allow Long Paths
        run: git config --system core.longpaths true

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nerdbank.GitVersioning computes the version from the history.
          fetch-depth: 0

      # The SDK builds; the .NET 6 runtime runs the net6.0 test assemblies.
      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            6.0.x
            10.0.x

      - name: Test
        run: dotnet test StyleCop.Analyzers/${{ matrix.project }}/${{ matrix.project }}.csproj --configuration Release ${{ !matrix.netfx && '--framework net6.0' || '' }} --logger trx --results-directory TestResults

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results-${{ matrix.project }}
          path: TestResults/*.trx
          if-no-files-found: ignore
